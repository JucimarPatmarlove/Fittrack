# ════════════════════════════════════════════════════════════════
# FitTrack V7 — Nginx Configuration (Self-Hosted)
# ════════════════════════════════════════════════════════════════
# - SPA fallback (React Router)
# - Reverse proxy /api → BFF container
# - Security headers (CSP, HSTS, X-Frame-Options)
# - Gzip compression
# - Asset caching (hashed filenames = long-lived cache)
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── GZIP COMPRESSION ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ── SECURITY HEADERS ────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;

    # CSP adaptado para self-hosted (sem Vercel analytics)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' wss: ws: https://*.anthropic.com https://*.googleapis.com https://raw.githack.com https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;" always;

    # ── REVERSE PROXY: /api → BFF Container ─────────────────────
    location /api/ {
        proxy_pass http://fittrack-bff:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # Sem cache para API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── STATIC ASSETS (Hashed → Long Cache) ─────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ── SERVICE WORKER (Sem cache — sempre fresh) ───────────────
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    location = /workbox-*.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }

    # ── PWA MANIFEST ────────────────────────────────────────────
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json json; }
    }

    # ── SPA FALLBACK (React Router) ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── HEALTH CHECK ENDPOINT ───────────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
