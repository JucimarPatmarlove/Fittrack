<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080b0f"/>
      <stop offset="100%" style="stop-color:#0e1318"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="1" y="1" width="398" height="298" rx="16" fill="none" stroke="#ec4899" stroke-opacity="0.3"/>
  <!-- Grid -->
  <g stroke="#ec4899" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="300"/>
    <line x1="20" y1="0" x2="20" y2="300"/>
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="60" y1="0" x2="60" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="140" y1="0" x2="140" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="220" y1="0" x2="220" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="260" y1="0" x2="260" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="340" y1="0" x2="340" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="380" y1="0" x2="380" y2="300"/>
    <line x1="0" y1="0" x2="400" y2="0"/>
    <line x1="0" y1="20" x2="400" y2="20"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="220" x2="400" y2="220"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="260" x2="400" y2="260"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
  </g>
  <!-- Emoji -->
  <text x="200" y="120" font-size="48" text-anchor="middle" dominant-baseline="middle">🏃</text>
  <!-- Nome -->
  <text x="200" y="180" fill="#ec4899" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#glow)">Mountain Climbers</text>
  <!-- Grupo Muscular -->
  <text x="200" y="210" fill="#55626e" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle" text-transform="uppercase" letter-spacing="3">CARDIO</text>
  <!-- Badge -->
  <rect x="150" y="240" width="100" height="24" rx="12" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3"/>
  <text x="200" y="256" fill="#ec4899" font-family="'DM Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">FITTRACK V7</text>
</svg>