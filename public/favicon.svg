<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background matches the FitTrack dark aesthetic -->
  <rect width="100" height="100" rx="22" fill="#080b0f" />
  
  <!-- Outer glow bolt -->
  <path d="M56 18 L24 56 L48 56 L38 86 L82 40 L56 40 Z" fill="#ccff00" filter="url(#glow)" opacity="0.8" />
  
  <!-- Inner sharp bolt -->
  <path d="M56 18 L24 56 L48 56 L38 86 L82 40 L56 40 Z" fill="#ffffff" />
</svg>