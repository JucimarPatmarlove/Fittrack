<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>FitTrack V7</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.anthropic.com blob:; worker-src 'self' blob:; connect-src 'self' wss: ws: https://*.anthropic.com https://*.googleapis.com https://raw.githack.com https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://picsum.photos blob:; media-src 'self' blob:; frame-src 'self'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
    
    <!-- PWA para iOS e Android -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#080b0f" />
  </head>
  <body>
    <!-- SPLASH SCREEN DE CARREGAMENTO (Fittrack V7) -->
    <div id="fittrack-splash">
      <div class="splash-content">
        <h1 class="splash-logo">FITTRACK<span class="splash-dot">.</span></h1>
        <div class="splash-loader"></div>
        <p class="splash-text">A INICIAR MOTOR BIOLÓGICO...</p>
      </div>
    </div>
    
    <div id="root"></div>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600&display=swap');
      
      #fittrack-splash {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #080b0f;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      
      .splash-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .splash-logo {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 4rem;
        color: #eceae4;
        letter-spacing: 4px;
        margin: 0 0 20px 0;
        animation: pulse 2s infinite;
      }

      .splash-dot {
        color: #ccff00;
      }

      .splash-loader {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(204, 255, 0, 0.1);
        border-top-color: #ccff00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
        box-shadow: 0 0 15px rgba(204, 255, 0, 0.2);
      }

      .splash-text {
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        color: #55626e;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      @keyframes spin { 
        to { transform: rotate(360deg); } 
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; text-shadow: 0 0 20px rgba(204,255,0,0.2); }
      }

      /* Quando a classe hidden é adicionada, ele desvanece */
      #fittrack-splash.hidden {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
